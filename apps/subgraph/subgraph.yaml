# YieldPilot subgraph manifest.
# Contract address + start block are populated by `` after
# Hardhat Ignition runs on each chain.

specVersion: 1.0.0
description: YieldPilot — ERC-4626 vault events
repository: https://github.com/nawarhisso/yield-pilot
schema:
  file: ./schema.graphql

dataSources:
  - kind: ethereum
    name: YieldVault
    network: sepolia
    source:
      address: "0x62B63E6E3e8b265D7A4A807B50db7f9069E9Dd2B"
      abi: YieldVault
      startBlock: 10693000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - VaultDeposit
        - VaultWithdrawal
        - UserPosition
        - VaultStats
        - SharePriceSnapshot
      abis:
        - name: YieldVault
          file: ./abis/YieldVault.json
      eventHandlers:
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleDeposit
        - event: Withdraw(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleWithdraw
      file: ./src/yield-vault.ts
