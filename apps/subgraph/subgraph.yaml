# YieldPilot subgraph manifest.
# Contract address + start block are populated by `` after
# Hardhat Ignition runs on each chain.

specVersion: 1.0.0
description: YieldPilot — ERC-4626 vault events + Safe operator activity
repository: https://github.com/nawarhisso/yield-pilot
schema:
  file: ./schema.graphql

dataSources:
  - kind: ethereum
    name: YieldVault
    network: sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: YieldVault
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - VaultDeposit
        - VaultWithdrawal
        - UserPosition
        - VaultStats
      abis:
        - name: YieldVault
          file: ./abis/YieldVault.json
      eventHandlers:
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleDeposit
        - event: Withdraw(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleWithdraw
      file: ./src/yield-vault.ts

  - kind: ethereum
    network: sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
      abis:
      eventHandlers:
        - event: StrategyExecuted(indexed address,indexed address,address)
          handler: handleStrategyExecuted
