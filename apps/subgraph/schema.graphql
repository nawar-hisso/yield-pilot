type VaultDeposit @entity(immutable: true) {
  id: Bytes!
  user: Bytes!
  assets: BigInt!
  shares: BigInt!
  timestamp: BigInt!
  block: BigInt!
  transactionHash: Bytes!
}

type VaultWithdrawal @entity(immutable: true) {
  id: Bytes!
  user: Bytes!
  assets: BigInt!
  shares: BigInt!
  timestamp: BigInt!
  block: BigInt!
  transactionHash: Bytes!
}

type UserPosition @entity(immutable: false) {
  id: Bytes!
  totalDeposited: BigInt!
  totalWithdrawn: BigInt!
  currentShares: BigInt!
  depositCount: Int!
  lastActivity: BigInt!
}

  id: Bytes!
  operator: Bytes!
  safe: Bytes!
  target: Bytes!
  action: String!
  timestamp: BigInt!
  transactionHash: Bytes!
}

type VaultStats @entity(immutable: false) {
  "singleton id = 0x00"
  id: Bytes!
  totalAssets: BigInt!
  totalShares: BigInt!
  uniqueDepositors: Int!
  updatedAt: BigInt!
}

"""
Share-price checkpoint captured on every Deposit and Withdraw event. Share
price is derived from the vault's on-chain totalAssets() and totalSupply()
at the event block, so it includes strategy yield — the TVL snapshot in
VaultStats alone can't see that. `priceE18 = totalAssets * 1e18 / totalShares`
(or 1e18 when totalShares is zero). Used by the web client to compute a
true share-price-based APY instead of an inflow proxy.
"""
type SharePriceSnapshot @entity(immutable: true) {
  id: Bytes!
  timestamp: BigInt!
  block: BigInt!
  totalAssets: BigInt!
  totalShares: BigInt!
  priceE18: BigInt!
}
