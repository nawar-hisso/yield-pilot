# YieldPilot — local dev stack.
# Run from repo root: `docker compose -f docker/docker-compose.yml up -d db`

services:
  db:
    image: postgres:16-alpine
    container_name: yield-pilot-db
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: yield-pilot
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d yield-pilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Optional: local subgraph indexer against a running `hardhat node` ---
  # ipfs:
  #   image: ipfs/kubo:latest
  #   ports:
  #     - "5001:5001"
  # graph-node:
  #   image: graphprotocol/graph-node:latest
  #   depends_on: [db, ipfs]
  #   ports:
  #     - "8000:8000"
  #     - "8020:8020"
  #   environment:
  #     postgres_host: db
  #     postgres_user: dev
  #     postgres_pass: dev
  #     postgres_db: graph
  #     ipfs: ipfs:5001
  #     ethereum: "local:http://host.docker.internal:8545"
  #     GRAPH_LOG: info

volumes:
  db-data:
